name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  test:
    name: Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: vitest run
        run: npm run test:run -- --reporter=verbose

  models:
    name: Model codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Blender is not installed here on purpose: the .evr.json intermediates
      # are committed, so CI only has to prove the generated module matches
      # them. Regenerating from the recipes is a local step.
      - name: Generated models are up to date
        run: npm run models:check

  changelog:
    name: Changelog codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # CHANGELOG.md is the source of truth for in-game patch notes, and this
      # is the gate that keeps it, package.json's version and the release tag
      # in agreement. It also fails on a hand-edited generated module.
      - name: Generated changelog is up to date
        run: npm run changelog:check

  build:
    name: Build & bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run size
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: everroad-dist
          path: dist/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [format, typecheck, test, models, changelog, build, audit]
    steps:
      - name: Gate on required jobs
        run: |
          echo "format=${{ needs.format.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "models=${{ needs.models.result }}"
          echo "changelog=${{ needs.changelog.result }}"
          echo "build=${{ needs.build.result }}"
          echo "audit=${{ needs.audit.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
