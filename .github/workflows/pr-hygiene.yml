name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional title & body
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|chore)(\([a-z0-9-]+\))?: .+'; then
            echo "::error::PR title must be 'type(scope): description' — feat, fix, perf, refactor, docs, test, chore."
            exit 1
          fi
      - name: Check PR body has a test plan
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -qi 'test plan'; then
            echo "::error::PR body must include a '## Test plan' section."
            exit 1
          fi
